<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Центр Функционального Развития «Шифу Панда»</title>
  <meta name="description" content="Спорт, развитие детей и взрослых. Екатеринбург.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

  <!-- Хедер (вставляется из js/header.js) -->
  <div id="header-container"></div>

  <!-- Слайдер -->
  <section class="slider" id="slider"></section>

  <!-- Разделитель -->
  <div class="divider" id="globalDivider"></div>

  <!-- Расписание (картинки) -->
  <section class="section" id="schedule">
    <div class="container">
      <h2 class="section-title">Расписание занятий</h2>
      <div class="schedule-switch" id="schedule-switch" hidden>
        <button type="button" class="schedule-switch-btn active" data-view="images">🖼 Картинки</button>
        <button type="button" class="schedule-switch-btn" data-view="table">📋 Таблица</button>
      </div>
      <div class="schedule-grid" id="schedule-grid"></div>
      <div id="schedule-table-view" hidden></div>
    </div>
  </section>

  <!-- Цены (картинка) -->
  <section class="section" id="prices">
    <div class="container">
      <h2 class="section-title">Наши цены</h2>
      <div class="prices-grid" id="prices-grid"></div>
    </div>
  </section>

  <!-- Программы -->
  <section class="section" id="programs">
    <div class="container">
      <h2 class="section-title">Программы тренировок</h2>
      <div class="programs-grid" id="programs-grid"></div>
    </div>
  </section>

  <!-- Тренеры -->
  <section class="section" id="trainers">
    <div class="container">
      <h2 class="section-title">Наши тренеры</h2>
      <div class="trainers-grid" id="trainers-grid"></div>
    </div>
  </section>

  <!-- Разделитель -->
  <div class="divider"></div>

  <!-- Новости (динамика — данные из data.js) -->
  <section class="section" id="news">
    <div class="container">
      <h2 class="section-title">Новости центра</h2>
      <div class="news-grid" id="news-grid"></div>
    </div>
  </section>

  <!-- Футер (вставляется из js/footer.js) -->
  <div id="footer-container"></div>

  <!-- Плавающая кнопка звонка (видна только на мобильных) -->
  <button class="floating-call" onclick="openCallModal('Плавающая кнопка')" aria-label="Заказать звонок">📞</button>

  <!-- Данные сайта. core.js обязателен и идёт первым, дальше — только модули
       тех секций, что есть на этой странице. Генератор: npm run static:export -->
  <script src="js/data/core.js?v=15"></script>
  <script src="js/data/slider.js?v=15"></script>
  <script src="js/data/schedule.js?v=15"></script>
  <script src="js/data/schedule-table.js?v=15"></script>
  <script src="js/data/prices.js?v=15"></script>
  <script src="js/data/programs.js?v=15"></script>
  <script src="js/data/trainers.js?v=15"></script>
  <script src="js/data/news.js?v=15"></script>

  <!-- Компоненты -->
  <script src="js/header.js?v=15"></script>
  <script src="js/footer.js?v=15"></script>
  <script src="js/modal.js?v=15"></script>

  <!-- Основная логика (слайдер, рендер секций, мобильное меню) -->
  <script src="js/schedule-ui.js?v=15"></script>
  <script src="js/main.js?v=15"></script>

</body>
</html>
