<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новости центра — Шифу Панда</title>
  <meta name="description" content="Новости центра функционального развития Шифу Панда.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=48">
</head>
<body data-doc-title="Новости">
  <div id="header-container"></div>

  <section class="section">
    <div class="container" id="page-main">
      <h1 class="section-title" data-section="news">Новости центра</h1>
      <p class="section-subtitle" data-section="news"></p>
      <div id="news-grid" class="news-grid"></div>
      <p id="news-empty" class="empty-note" hidden>Новостей пока нет</p>
    </div>
  </section>

  <div class="divider"></div>
  <div id="footer-container"></div>
  <button class="floating-call" onclick="openCallModal('Плавающая кнопка')" aria-label="Заказать звонок"><i class="icon-call"></i></button>

  <!-- Модалка полного текста новости -->
  <div class="modal-overlay" id="newsModal" role="dialog" aria-modal="true" aria-labelledby="newsModalTitle">
    <div class="modal-box news-modal-box">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="newsModalTitle"></h2>
          <p class="modal-reason" id="newsModalDate"></p>
        </div>
        <button type="button" class="modal-close" id="newsModalClose" aria-label="Закрыть">&times;</button>
      </div>
      <div class="news-body" id="newsModalBody"></div>
      <div class="news-media" id="newsModalMedia"></div>
    </div>
  </div>

  <script src="js/data/core.js?v=48"></script>
  <script src="js/appearance.js?v=48"></script>
  <script src="js/layout.js?v=48"></script>
  <script src="js/seo.js?v=48"></script>
  <script src="js/panels.js?v=48"></script>
  <script src="js/data/news-all.js?v=48"></script>
  <script src="js/data/news-full.js?v=48"></script>
  <script src="js/md.js?v=48"></script>
  <script src="js/news-grid.js?v=48"></script>
  <script src="js/header.js?v=48"></script>
  <script src="js/footer.js?v=48"></script>
  <script src="js/modal.js?v=48"></script>
  <script src="js/lightbox.js?v=48"></script>
  <script>
    (function () {
      const data = window.SITE_DATA || {};
      const L = window.Layout;
      const news = Array.isArray(data.newsAll) ? data.newsAll : [];
      const full = data.newsFull || {};
      const grid = document.getElementById('news-grid');
      const empty = document.getElementById('news-empty');
      const overlay = document.getElementById('newsModal');
      const pageMain = document.getElementById('page-main');

      // S127 п.5/п.6: крошки и перекрёстные ссылки общей страницы
      if (L) {
        L.applyDocumentTitle('news', 'Новости центра');
        L.renderCrumbs(pageMain, [
          { href: 'index.html', label: 'Главная' },
          { label: L.sectionName('news', 'Новости центра') }
        ]);
        L.renderCrossLinks(pageMain, 'news');
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatDate(iso) {
        if (!iso) return '';
        try { return new Date(iso).toLocaleDateString('ru-RU'); } catch (e) { return iso; }
      }

      if (!news.length) {
        grid.hidden = true;
        empty.hidden = false;
      } else {
        grid.innerHTML = buildGrid(news);
      }

      /* S124/S125: разметка плитки общая с главной — js/news-grid.js.
         news.html показывает ВСЕ новости, включая отмеченные «На главной» (showOnHome). */
      function buildGrid(list) {
        return window.NewsGrid.build(list, 'openNews', function (n) {
          if (n.long) return 'Читать полностью →';
          if (n.image || n.video) return 'Смотреть фото →';
          return null;   // пустая карточка без медиа и без длинного текста — кнопки нет
        });
      }

      /* ---------- Модалка ---------- */
      function openNews(id) {
        const n = news.filter(x => String(x.id) === String(id))[0];
        if (!n) {
          location.replace('404.html?from=' + encodeURIComponent('news.html?id=' + id) + '&id=' + encodeURIComponent(id));
          return;
        }
        document.getElementById('newsModalTitle').textContent = n.title;
        document.getElementById('newsModalDate').textContent = formatDate(n.date);
        const gal = 'news-modal-' + n.id;
        // S111: обложка — первый объект в теле новости, текст огибает; фото/видео — в конце (news-media)
        const coverHtml = n.image
          ? `<span class="lightbox-zoom news-cover-float" data-gallery="${gal}"><img src="${n.image}" alt="${esc(n.title)}"></span>`
          : '';
        document.getElementById('newsModalBody').innerHTML =
          coverHtml + (window.MD ? window.MD.render(full[n.id] || n.preview || '') : esc(full[n.id] || ''));

        let media = '';
        const photos = Array.isArray(n.photos) ? n.photos : [];
        if (photos.length) {
          media += `<div class="news-photos">` + photos.map(p =>
            `<div class="lightbox-zoom news-photo" data-gallery="${gal}"><img src="${p}" alt="${esc(n.title)}" loading="lazy"></div>`
          ).join('') + `</div>`;
        }
        if (n.video) {
          media += `<video controls playsinline><source src="${n.video}">Ваш браузер не поддерживает видео.</video>`;
        }
        document.getElementById('newsModalMedia').innerHTML = media;

        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        history.replaceState(null, '', '?id=' + n.id);
      }

      function closeNews() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
        history.replaceState(null, '', location.pathname);
      }

      window.openNews = openNews;
      window.closeNews = closeNews;

      document.getElementById('newsModalClose').addEventListener('click', function (e) {
        e.stopPropagation();
        closeNews();
      });
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeNews();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('open')) closeNews();
      });

      // Пришли по ссылке вида news.html?id=7 — сразу открыть окно
      const wanted = new URLSearchParams(location.search).get('id');
      if (wanted) openNews(wanted);
    })();
  </script>
  <script src="js/visit-tracker.js?v=48"></script>
</body>
</html>
