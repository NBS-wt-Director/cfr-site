<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | ЦФР</title>
  <style>
    :root {
      --primary: #2563eb;
      --text: #1e293b;
      --text-secondary: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .error-container {
      background: var(--card);
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 500px;
      text-align: center;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 1rem;
    }

    .error-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .error-text {
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
      transform: translateY(-2px);
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 640px) {
      .error-container {
        padding: 2rem 1.5rem;
      }
      
      .error-code {
        font-size: 4rem;
      }
      
      .error-title {
        font-size: 1.25rem;
      }
      
      .error-actions {
        flex-direction: column;
      }
      
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="emoji">🔍</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Страница не найдена</h1>
    <p class="error-text">
      Запрашиваемая страница не существует или была удалена.<br>
      Возможно, вы ввели неправильный адрес или ссылка устарела.
    </p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">🏠 На главную</a>
      <button onclick="history.back()" class="btn btn-secondary">← Назад</button>
    </div>
  </div>
</body>
</html>
