version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cfr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cfr_site
      POSTGRES_USER: cfr
      POSTGRES_PASSWORD: cfr_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfr -d cfr_site"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: