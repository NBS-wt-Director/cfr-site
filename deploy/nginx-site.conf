# центр-фр.рф — статический сайт (S66/S67). Полный рабочий конфиг:
#   HTTP→HTTPS редирект + HTTPS (статика из static/) + www-редиректы.
# Сертификаты: Let's Encrypt (certbot) — пути НЕ менять вручную.
# punycode-домен xn----itbymbjqk.xn--p1ai = центр-фр.рф
#
# УСТАНОВКА: sudo cp deploy/nginx-site.conf /etc/nginx/sites-enabled/центр-фр.рф
#            sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS ──────────────────────────────────────────────
server {
    listen 80 ;
    listen [::]:80 ;
    server_name xn----itbymbjqk.xn--p1ai www.xn----itbymbjqk.xn--p1ai;
    return 301 https://xn----itbymbjqk.xn--p1ai$request_uri;
}

# ── HTTPS: статический сайт ───────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn----itbymbjqk.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn----itbymbjqk.xn--p1ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xn----itbymbjqk.xn--p1ai/privkey.pem; # managed by Certbot

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /home/cfr_balloo/sites/cfrsite/static;
    index index.html;

    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # Статика (css/js/картинки/шрифты). /uploads/* и /data/* покрываются root'ом
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # ── ЭТАП B: админка (admin-server :3456). Раскомментить после переключения PM2 ──
    # location /api/admin/ {
    #     proxy_pass http://127.0.0.1:3456;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 50m;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }

    # Страницы: только реальный файл. Иначе — честный 404 через error_page.
    # ВАЖНО: не /index.html в конце — иначе любая опечатка отдаёт главную с кодом 200
    # (мягкий 404: битые ссылки не видны, поисковики индексируют мусор).
    location / {
        try_files $uri $uri/ =404;
    }
}

# ── HTTPS www → без www ───────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xn----itbymbjqk.xn--p1ai;
    ssl_certificate /etc/letsencrypt/live/xn----itbymbjqk.xn--p1ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xn----itbymbjqk.xn--p1ai/privkey.pem; # managed by Certbot
    return 301 https://xn----itbymbjqk.xn--p1ai$request_uri;
}
